<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Sync – Room</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            boxShadow: { glass: "0 10px 30px rgba(0,0,0,0.25)" },
            backdropBlur: { glass: "14px" },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
      }
      .glass {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(14px);
      }
      .glass-light {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(14px);
      }
      .fade-in {
        animation: fadeIn 180ms ease-out both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .btn-run {
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }
      .btn-run:active {
        transform: translateY(1px) scale(0.99);
      }
      .resize-y {
        cursor: row-resize;
      }
      .monaco-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .kbd {
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 8px;
        font-size: 12px;
      }
      .light .kbd {
        border-color: rgba(0, 0, 0, 0.12);
        background: rgba(255, 255, 255, 0.65);
      }
    </style>
  </head>

  <body class="h-full bg-slate-950 text-slate-100 dark">
    <div id="app" class="h-full w-full">
      <div class="px-3 py-2 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-2">
          <a href="/" class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 shadow-glass"></a>
          <div class="leading-tight">
            <div class="text-sm font-semibold">Code Sync</div>
            <div class="text-xs text-slate-300">Room IDE</div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <div class="hidden md:flex items-center gap-2 text-xs text-slate-300">
            <span class="kbd">Ctrl</span><span class="kbd">K</span>
            <span class="opacity-70">Command palette</span>
          </div>

          <select
            id="languageSelect"
            class="glass rounded-xl px-3 py-2 text-sm outline-none border border-white/10 bg-transparent"
          >
            <option value="python">Python (Judge0)</option>
            <option value="cpp">C++ (Judge0)</option>
            <option value="java">Java (Judge0)</option>
            <option value="minilang">MiniLang (local)</option>
          </select>

          <button
            id="runBtn"
            class="btn-run rounded-xl px-4 py-2 text-sm font-semibold bg-emerald-500/90 hover:bg-emerald-500 shadow-glass"
          >
            Run
          </button>

          <button
            id="shareBtn"
            class="rounded-xl px-3 py-2 text-sm glass hover:bg-white/10 border border-white/10"
          >
            Share
          </button>

          <button
            id="themeBtn"
            class="rounded-xl px-3 py-2 text-sm glass hover:bg-white/10 border border-white/10"
            title="Toggle theme"
          >
            Theme
          </button>
        </div>
      </div>

      <div class="h-[calc(100%-52px)] grid grid-cols-12 gap-0">
        <aside class="col-span-12 md:col-span-3 xl:col-span-2 border-r border-white/10 p-3 space-y-3">
          <div class="glass rounded-2xl p-3">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xs text-slate-300">Room</div>
                <div class="text-sm font-semibold" id="roomLabel">—</div>
              </div>
              <a
                href="/"
                class="rounded-xl px-3 py-2 text-xs glass hover:bg-white/10 border border-white/10"
              >
                Home
              </a>
            </div>

            <div class="mt-3 grid grid-cols-2 gap-2">
              <input
                id="nameInput"
                class="w-full rounded-xl px-3 py-2 text-sm bg-transparent border border-white/10 outline-none"
                placeholder="Your name"
              />
              <select
                id="roleSelect"
                class="w-full rounded-xl px-3 py-2 text-sm bg-transparent border border-white/10 outline-none"
              >
                <option value="editor">Editor</option>
                <option value="viewer">Viewer</option>
              </select>
            </div>

            <button
              id="joinBtn"
              class="mt-2 w-full rounded-xl px-3 py-2 text-sm font-semibold bg-indigo-500/90 hover:bg-indigo-500 shadow-glass"
            >
              Join (again)
            </button>
          </div>

          <div class="glass rounded-2xl p-3">
            <div class="flex items-center justify-between">
              <div class="text-sm font-semibold">Online</div>
              <div id="onlineCount" class="text-xs text-slate-300">0</div>
            </div>
            <div id="usersList" class="mt-2 space-y-2 text-sm"></div>
          </div>

          <div class="glass rounded-2xl p-3 flex flex-col h-[calc(100%-280px)] min-h-[260px]">
            <div class="flex items-center justify-between">
              <div class="text-sm font-semibold">Chat</div>
              <div class="text-xs text-slate-300" id="chatStatus">—</div>
            </div>
            <div id="chatLog" class="mt-2 flex-1 overflow-auto space-y-2 text-sm pr-1"></div>
            <div class="mt-2 flex gap-2">
              <input
                id="chatInput"
                class="flex-1 rounded-xl px-3 py-2 text-sm bg-transparent border border-white/10 outline-none"
                placeholder="Message..."
              />
              <button
                id="chatSendBtn"
                class="rounded-xl px-3 py-2 text-sm glass hover:bg-white/10 border border-white/10"
              >
                Send
              </button>
            </div>
          </div>
        </aside>

        <main class="col-span-12 md:col-span-9 xl:col-span-10 flex flex-col">
          <div class="px-3 py-2 border-b border-white/10 flex items-center justify-between">
            <div id="tabs" class="flex items-center gap-2 overflow-auto">
              <button class="tabBtn px-3 py-2 text-sm rounded-xl glass border border-white/10" data-tab="main">
                main
              </button>
            </div>
            <div class="text-xs text-slate-300" id="syncStatus">Not connected</div>
          </div>

          <div class="flex-1 relative">
            <div id="editor" class="monaco-container"></div>
          </div>

          <div id="resizeHandle" class="h-2 bg-white/5 hover:bg-white/10 resize-y"></div>

          <div id="bottomPanel" class="h-52 border-t border-white/10 grid grid-cols-2 gap-0">
            <section class="p-3 border-r border-white/10">
              <div class="text-sm font-semibold mb-2">Input (stdin)</div>
              <textarea
                id="stdin"
                class="w-full h-[calc(100%-28px)] rounded-2xl p-3 text-sm bg-transparent border border-white/10 outline-none"
                placeholder="Optional input..."
              ></textarea>
            </section>
            <section class="p-3">
              <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-semibold">Output</div>
                <button id="clearOutputBtn" class="rounded-xl px-3 py-2 text-xs glass hover:bg-white/10 border border-white/10">
                  Clear
                </button>
              </div>
              <pre
                id="output"
                class="w-full h-[calc(100%-28px)] rounded-2xl p-3 text-xs overflow-auto bg-black/30 border border-white/10"
              ></pre>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="toasts" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <div id="paletteBackdrop" class="hidden fixed inset-0 bg-black/60 z-50"></div>
    <div id="palette" class="hidden fixed inset-x-0 top-20 mx-auto max-w-xl z-50 px-4">
      <div class="glass rounded-2xl shadow-glass border border-white/10 p-3 fade-in">
        <input
          id="paletteInput"
          class="w-full rounded-xl px-3 py-2 text-sm bg-transparent border border-white/10 outline-none"
          placeholder="Type a command..."
        />
        <div id="paletteList" class="mt-2 space-y-1 text-sm"></div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
