<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Sync – Room</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            boxShadow: { glass: "0 10px 30px rgba(0,0,0,0.25)" },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      .hidden { display: none !important; }
      :root {
        --bg0: #07090f; --bg1: #0d1117; --bg2: #161b22;
        --surface: rgba(255,255,255,0.04); --surface-h: rgba(255,255,255,0.07);
        --border: rgba(255,255,255,0.07); --border-m: rgba(255,255,255,0.12); --border-h: rgba(255,255,255,0.22);
        --ink: #e6edf3; --ink-2: #7d8590; --ink-3: #3d444d;
        --blue: #4d9de0; --blue-glow: rgba(77,157,224,0.18); --cyan: #39d0d8;
        --emerald: #3fb950; --emerald-glow: rgba(63,185,80,0.18); --amber: #d29922; --red: #f85149;
        --font-mono: 'JetBrains Mono', monospace; --font-ui: 'Outfit', sans-serif; --r: 10px; --r-lg: 14px;
        /* Fairyfloss-style purple panels (sidebar, chat, terminal, top bar, tabs) */
        --pp-bg: #3f3a52;
        --pp-elevated: #4a4358;
        --pp-card: #5a5475;
        --pp-input: #46425e;
        --pp-border: rgba(197, 163, 255, 0.14);
        --pp-border-m: rgba(197, 163, 255, 0.24);
        --pp-accent: #c5a3ff;
        --pp-accent-dim: rgba(197, 163, 255, 0.16);
        --pp-accent-text: #1a1528;
        --pp-label: #c9bddf;
        --pp-muted: #9a90b8;
        --pp-row-bg: rgba(90, 84, 117, 0.35);
      }
      html, body { height: 100%; font-family: var(--font-ui); font-size: 14px; background: var(--bg0); color: var(--ink); overflow: hidden; }
      body.light {
        --bg0: #f6f8fa; --bg1: #ffffff; --bg2: #f0f2f5;
        --surface: rgba(0,0,0,0.03); --surface-h: rgba(0,0,0,0.06);
        --border: rgba(0,0,0,0.07); --border-m: rgba(0,0,0,0.12); --border-h: rgba(0,0,0,0.20);
        --ink: #1c2128; --ink-2: #57606a; --ink-3: #adb8c4;
        --pp-bg: #ebe6f5;
        --pp-elevated: #e4ddf2;
        --pp-card: #dcd4ec;
        --pp-input: #d2c8e6;
        --pp-border: rgba(74, 58, 112, 0.14);
        --pp-border-m: rgba(74, 58, 112, 0.22);
        --pp-accent: #8b6fd4;
        --pp-accent-dim: rgba(139, 111, 212, 0.18);
        --pp-accent-text: #1f1830;
        --pp-label: #5a4a78;
        --pp-muted: #6f6088;
        --pp-row-bg: rgba(255, 255, 255, 0.55);
      }
      #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg0); }
      .topbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; background: var(--pp-bg); border-bottom: 1px solid var(--pp-border-m); gap: 10px; }
      .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center; text-decoration: none; overflow: hidden; flex-shrink: 0; }
      .brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .topbar-title .t1 { font-size: 13px; font-weight: 600; color: var(--ink); }
      .topbar-title .t2 { font-size: 11px; color: var(--pp-muted); font-family: var(--font-mono); }
      .topbar-center { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
      .topbar .kbd-hint { color: var(--pp-muted); }
      .topbar .kbd-hint span:not(.kbd) { color: var(--pp-muted) !important; }
      .kbd-hint { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
      .topbar .kbd { background: var(--pp-input); border: 1px solid var(--pp-border-m); color: var(--ink); padding: 2px 5px; border-radius: 4px; font-size: 10px; }
      .kbd { background: var(--bg2); border: 1px solid var(--border-m); padding: 2px 5px; border-radius: 4px; font-size: 10px; }
      .topbar-right { display: flex; align-items: center; gap: 6px; }
      .topbar .lang-select { background: var(--pp-input); border-color: var(--pp-border-m); color: var(--ink); }
      .topbar .btn-ghost { color: var(--pp-label); background: var(--pp-accent-dim); border-color: var(--pp-border-m); }
      .topbar .btn-ghost:hover { background: var(--pp-card); color: var(--ink); border-color: rgba(197, 163, 255, 0.35); }
      body.light .topbar .btn-ghost:hover { border-color: rgba(74, 58, 112, 0.28); }
      select.lang-select, input.field-input, select.field-select {
        border-radius: var(--r); border: 1px solid var(--border-m); background: var(--bg2); color: var(--ink); outline: none;
      }
      select.lang-select { font-family: var(--font-mono); font-size: 11px; padding: 6px 28px 6px 10px; -webkit-appearance: none; appearance: none; cursor: pointer; }
      .btn-run { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; background: linear-gradient(135deg, #238636, #2ea043); color: #fff; border: 0; border-radius: var(--r); cursor: pointer; box-shadow: 0 0 10px rgba(46,160,67,0.28); }
      .btn-run:disabled { opacity: .6; cursor: not-allowed; }
      .btn-ghost { display: flex; align-items: center; gap: 6px; padding: 6px 11px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border-m); border-radius: var(--r); cursor: pointer; }
      .body-row { display: flex; flex: 1; overflow: hidden; min-height: 0; }
      .sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--pp-bg); border-right: 1px solid var(--pp-border-m); overflow: hidden; }
      .sidebar-section { border-bottom: 1px solid var(--pp-border); padding: 12px; flex-shrink: 0; }
      .sidebar .section-label { color: var(--pp-label); }
      .section-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
      .room-card { background: var(--pp-card); border: 1px solid var(--pp-border-m); border-radius: var(--r-lg); padding: 10px 12px; }
      .room-id-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .room-id-label { font-size: 10px; color: var(--pp-muted); }
      .room-id-value { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--pp-accent); background: var(--pp-accent-dim); border: 1px solid rgba(197, 163, 255, 0.35); padding: 2px 8px; border-radius: 6px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      body.light .room-id-value { border-color: rgba(74, 58, 112, 0.28); }
      .identity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
      input.field-input, select.field-select { width: 100%; padding: 7px 9px; font-size: 12px; font-family: var(--font-ui); }
      .sidebar input.field-input,
      .sidebar select.field-select { background: var(--pp-input); border-color: var(--pp-border-m); color: var(--ink); }
      .room-card a[href="/"] { background: var(--pp-input) !important; border-color: var(--pp-border-m) !important; color: var(--pp-label) !important; }
      .btn-join { width: 100%; padding: 7px; font-size: 12px; font-weight: 600; background: var(--pp-accent); color: var(--pp-accent-text); border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 0 14px rgba(197, 163, 255, 0.22); }
      body.light .btn-join { box-shadow: 0 0 12px rgba(139, 111, 212, 0.2); }
      .online-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .online-badge { font-family: var(--font-mono); font-size: 10px; background: var(--pp-accent-dim); color: var(--pp-accent); border: 1px solid rgba(197, 163, 255, 0.35); padding: 2px 7px; border-radius: 99px; display: flex; align-items: center; gap: 5px; }
      body.light .online-badge { border-color: rgba(74, 58, 112, 0.25); }
      .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #80ffea; box-shadow: 0 0 8px rgba(128, 255, 234, 0.55); }
      .chat-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; padding: 12px; gap: 8px; background: var(--pp-bg); border-top: 1px solid var(--pp-border); }
      .chat-header { display: flex; align-items: center; justify-content: space-between; }
      .chat-header #chatStatus { color: var(--pp-muted) !important; }
      #chatLog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
      .sidebar #usersList > div,
      #chatLog > div {
        border-color: var(--pp-border-m) !important;
        background: var(--pp-row-bg) !important;
      }
      .sidebar #usersList select {
        background: var(--pp-input) !important;
        border-color: var(--pp-border-m) !important;
        color: var(--ink) !important;
      }
      .sidebar .text-slate-300 { color: var(--pp-muted) !important; }
      .chat-input-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; width: 100%; min-width: 0; }
      #chatInput { flex: 1; min-width: 0; padding: 7px 10px; font-size: 12px; font-family: var(--font-ui); color: var(--ink); background: var(--pp-input); border: 1px solid var(--pp-border-m); border-radius: 8px; outline: none; }
      .btn-send { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; min-width: 34px; padding: 0; font-size: 12px; font-weight: 600; color: var(--pp-accent-text); background: var(--pp-accent); border: 1px solid rgba(197, 163, 255, 0.45); border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px rgba(197, 163, 255, 0.18); }
      body.light .btn-send { border-color: rgba(74, 58, 112, 0.25); }
      .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
      .tabs-bar { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; background: var(--pp-bg); border-bottom: 1px solid var(--pp-border-m); gap: 8px; }
      #tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
      #syncStatus { font-family: var(--font-mono); font-size: 10px; color: var(--pp-muted); white-space: nowrap; }
      .tab-btn {
        font-family: var(--font-ui);
        border: 1px solid var(--pp-border-m);
        background: var(--pp-input);
        color: var(--ink);
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .tab-btn:hover { background: var(--pp-accent-dim); border-color: rgba(197, 163, 255, 0.32); }
      body.light .tab-btn:hover { border-color: rgba(74, 58, 112, 0.28); }
      .tab-btn-active {
        background: var(--pp-card);
        border-color: var(--pp-accent);
        box-shadow: inset 0 0 0 1px rgba(197, 163, 255, 0.12);
      }
      body.light .tab-btn-active { box-shadow: inset 0 0 0 1px rgba(74, 58, 112, 0.12); }
      .editor-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
      .monaco-container { position: absolute; inset: 0; }
      .resize-handle { height: 4px; background: var(--pp-border-m); cursor: row-resize; flex-shrink: 0; }
      #bottomPanel { height: 200px; display: flex; flex-direction: column; border-top: 1px solid var(--pp-border-m); flex-shrink: 0; overflow: hidden; background: var(--pp-bg); padding: 10px 12px; gap: 6px; }
      .terminal-header { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--pp-label); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
      #bottomPanel .btn-clear { font-size: 10px; font-family: var(--font-mono); color: var(--pp-label); background: var(--pp-accent-dim); border: 1px solid var(--pp-border-m); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
      #bottomPanel .btn-clear:hover { background: var(--pp-card); color: var(--ink); }
      .terminal-body { flex: 1; display: flex; flex-direction: column; min-height: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink); background: var(--pp-input); border: 1px solid var(--pp-border-m); border-radius: 8px; overflow: hidden; }
      #terminalScroll { flex: 1; overflow: auto; padding: 8px 10px; line-height: 1.6; min-height: 0; }
      #terminalOutput { margin: 0; }
      #terminalOutput .terminal-echo { color: var(--pp-muted); white-space: pre-wrap; word-break: break-word; }
      #terminalOutput .terminal-run { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
      #terminalOutput .terminal-run:first-child { margin-top: 0; }
      .terminal-input-row { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--pp-border-m); background: rgba(0,0,0,0.12); flex-shrink: 0; }
      body.light .terminal-input-row { background: rgba(0,0,0,0.04); }
      .terminal-prompt { color: var(--pp-accent); font-weight: 600; user-select: none; }
      #terminalInput { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font-family: inherit; font-size: inherit; }
      #terminalInput::placeholder { color: var(--pp-muted); opacity: 0.85; }
      #toasts { position: fixed; bottom: 16px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 6px; }
      #paletteBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; }
      #palette { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); width: 480px; max-width: calc(100vw - 32px); z-index: 51; }
      .palette-inner { background: var(--bg1); border: 1px solid var(--border-m); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.6); }
      #paletteInput { width: 100%; padding: 13px 16px; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--border-m); outline: none; }
      #paletteList { padding: 6px; }
    </style>
  </head>
  <body class="dark">
    <div id="app">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <a href="/" class="brand-mark">
            <img src="/static/codesync-logo.png" alt="CodeSync" width="32" height="32" />
          </a>
          <div class="topbar-title"><div class="t1">Code Sync</div><div class="t2">Room IDE</div></div>
        </div>
        <div class="topbar-right">
          <select id="languageSelect" class="lang-select">
            <option value="python">Python (Judge0)</option>
            <option value="cpp">C++ (Judge0)</option>
            <option value="java">Java (Judge0)</option>
            <option value="minilang">MiniLang (local)</option>
          </select>
          <button id="runBtn" class="btn-run"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Run</button>
          <button id="shareBtn" class="btn-ghost">Share</button>
          <button id="themeBtn" class="btn-ghost" title="Toggle theme">Theme</button>
        </div>
      </div>
      <div class="body-row">
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="section-label">Session</div>
            <div class="room-card">
              <div class="room-id-row">
                <span class="room-id-label">Room</span><span class="room-id-value" id="roomLabel">—</span>
                <a href="/" style="font-size:11px;color:var(--ink-2);text-decoration:none;padding:3px 7px;background:var(--surface);border:1px solid var(--border-m);border-radius:6px;">Home</a>
              </div>
              <div class="identity-grid">
                <input id="nameInput" class="field-input" type="text" placeholder="Your name" autocomplete="off" spellcheck="false" />
                <select id="roleSelect" class="field-select">
                  <option value="editor">✏️ Editor</option>
                  <option value="viewer">👁 Viewer</option>
                </select>
              </div>
              <button id="joinBtn" class="btn-join">Join Room</button>
            </div>
          </div>
          <div class="sidebar-section" style="flex-shrink:0;">
            <div class="online-row"><div class="section-label" style="margin-bottom:0;">Online</div><div class="online-badge"><div class="live-dot"></div><span id="onlineCount">0</span></div></div>
            <div id="usersList" class="users-scroll"></div>
          </div>
          <div class="chat-section">
            <div class="chat-header"><div class="section-label" style="margin-bottom:0;">Chat</div><span id="chatStatus" style="font-family:var(--font-mono);font-size:10px;color:var(--ink-3);">—</span></div>
            <div id="chatLog"></div>
            <div class="chat-input-row">
              <input id="chatInput" type="text" placeholder="Message…" autocomplete="off" spellcheck="false" />
              <button id="chatSendBtn" class="btn-send">↑</button>
            </div>
          </div>
        </aside>
        <main class="main-area">
          <div class="tabs-bar"><div id="tabs"></div><span id="syncStatus">Not connected</span></div>
          <div class="editor-wrap"><div id="editor" class="monaco-container"></div></div>
          <div id="resizeHandle" class="resize-handle"></div>
          <div id="bottomPanel">
            <div class="terminal-header"><span>Terminal</span><button id="clearTerminalBtn" type="button" class="btn-clear">Clear</button></div>
            <div class="terminal-body">
              <div id="terminalScroll"><div id="terminalOutput"></div></div>
              <div class="terminal-input-row"><span class="terminal-prompt">&gt;</span><input id="terminalInput" type="text" placeholder="Type input and press Enter…" autocomplete="off" spellcheck="false" /></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div id="toasts"></div>
    <div id="paletteBackdrop" class="hidden"></div>
    <div id="palette" class="hidden"><div class="palette-inner fade-in"><input id="paletteInput" placeholder="Type a command…" autocomplete="off" /><div id="paletteList"></div></div></div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/terminal.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
