<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Sync – Room</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            boxShadow: { glass: "0 10px 30px rgba(0,0,0,0.25)" },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      .hidden { display: none !important; }
      :root {
        --bg0: #07090f; --bg1: #0d1117; --bg2: #161b22;
        --surface: rgba(255,255,255,0.04); --surface-h: rgba(255,255,255,0.07);
        --border: rgba(255,255,255,0.07); --border-m: rgba(255,255,255,0.12); --border-h: rgba(255,255,255,0.22);
        --ink: #e6edf3; --ink-2: #7d8590; --ink-3: #3d444d;
        --blue: #4d9de0; --blue-glow: rgba(77,157,224,0.18); --cyan: #39d0d8;
        --emerald: #3fb950; --emerald-glow: rgba(63,185,80,0.18); --amber: #d29922; --red: #f85149;
        --font-mono: 'JetBrains Mono', monospace; --font-ui: 'Outfit', sans-serif; --r: 10px; --r-lg: 14px;
      }
      html, body { height: 100%; font-family: var(--font-ui); font-size: 14px; background: var(--bg0); color: var(--ink); overflow: hidden; }
      body.light {
        --bg0: #f6f8fa; --bg1: #ffffff; --bg2: #f0f2f5;
        --surface: rgba(0,0,0,0.03); --surface-h: rgba(0,0,0,0.06);
        --border: rgba(0,0,0,0.07); --border-m: rgba(0,0,0,0.12); --border-h: rgba(0,0,0,0.20);
        --ink: #1c2128; --ink-2: #57606a; --ink-3: #adb8c4;
      }
      #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg0); }
      .topbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; background: var(--bg1); border-bottom: 1px solid var(--border-m); gap: 10px; }
      .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px rgba(77,157,224,0.35); text-decoration: none; }
      .brand-mark svg { width: 14px; height: 14px; }
      .topbar-title .t1 { font-size: 13px; font-weight: 600; color: var(--ink); }
      .topbar-title .t2 { font-size: 11px; color: var(--ink-2); font-family: var(--font-mono); }
      .topbar-center { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
      .kbd-hint { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
      .kbd { background: var(--bg2); border: 1px solid var(--border-m); padding: 2px 5px; border-radius: 4px; font-size: 10px; }
      .topbar-right { display: flex; align-items: center; gap: 6px; }
      select.lang-select, input.field-input, select.field-select {
        border-radius: var(--r); border: 1px solid var(--border-m); background: var(--bg2); color: var(--ink); outline: none;
      }
      select.lang-select { font-family: var(--font-mono); font-size: 11px; padding: 6px 28px 6px 10px; -webkit-appearance: none; appearance: none; cursor: pointer; }
      .btn-run { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; background: linear-gradient(135deg, #238636, #2ea043); color: #fff; border: 0; border-radius: var(--r); cursor: pointer; box-shadow: 0 0 10px rgba(46,160,67,0.28); }
      .btn-run:disabled { opacity: .6; cursor: not-allowed; }
      .btn-ghost { display: flex; align-items: center; gap: 6px; padding: 6px 11px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border-m); border-radius: var(--r); cursor: pointer; }
      .body-row { display: flex; flex: 1; overflow: hidden; min-height: 0; }
      .sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg1); border-right: 1px solid var(--border-m); overflow: hidden; }
      .sidebar-section { border-bottom: 1px solid var(--border); padding: 12px; flex-shrink: 0; }
      .section-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
      .room-card { background: var(--bg2); border: 1px solid var(--border-m); border-radius: var(--r-lg); padding: 10px 12px; }
      .room-id-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .room-id-label { font-size: 10px; color: var(--ink-2); }
      .room-id-value { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-glow); border: 1px solid rgba(77,157,224,0.25); padding: 2px 8px; border-radius: 6px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .identity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
      input.field-input, select.field-select { width: 100%; padding: 7px 9px; font-size: 12px; font-family: var(--font-ui); }
      .btn-join { width: 100%; padding: 7px; font-size: 12px; font-weight: 600; background: linear-gradient(135deg, var(--blue), #1f6feb); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
      .online-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .online-badge { font-family: var(--font-mono); font-size: 10px; background: var(--emerald-glow); color: var(--emerald); border: 1px solid rgba(63,185,80,0.25); padding: 2px 7px; border-radius: 99px; display: flex; align-items: center; gap: 5px; }
      .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
      .chat-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; padding: 12px; gap: 8px; }
      .chat-header { display: flex; align-items: center; justify-content: space-between; }
      #chatLog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
      .chat-input-row { display: flex; gap: 6px; flex-shrink: 0; }
      #chatInput { flex: 1; padding: 7px 10px; font-size: 12px; font-family: var(--font-ui); color: var(--ink); background: var(--bg2); border: 1px solid var(--border-m); border-radius: 8px; outline: none; }
      .btn-send { height: 34px; min-width: 38px; padding: 7px 11px; font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-glow); border: 1px solid rgba(77,157,224,0.3); border-radius: 8px; cursor: pointer; }
      .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
      .tabs-bar { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; background: var(--bg1); border-bottom: 1px solid var(--border-m); gap: 8px; }
      #tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
      #syncStatus { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); white-space: nowrap; }
      .editor-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
      .monaco-container { position: absolute; inset: 0; }
      .resize-handle { height: 4px; background: var(--border); cursor: row-resize; flex-shrink: 0; }
      #bottomPanel { height: 200px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border-m); flex-shrink: 0; overflow: hidden; }
      .bottom-pane { display: flex; flex-direction: column; padding: 10px 12px; overflow: hidden; }
      .bottom-pane:first-child { border-right: 1px solid var(--border-m); }
      .pane-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; display: flex; justify-content: space-between; }
      #stdin, #output { flex: 1; font-family: var(--font-mono); font-size: 11px; color: var(--ink); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; line-height: 1.6; }
      #stdin { resize: none; outline: none; }
      #output { overflow: auto; white-space: pre-wrap; word-break: break-word; }
      .btn-clear { font-size: 10px; font-family: var(--font-mono); color: var(--ink-3); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
      #toasts { position: fixed; bottom: 16px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 6px; }
      #paletteBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; }
      #palette { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); width: 480px; max-width: calc(100vw - 32px); z-index: 51; }
      .palette-inner { background: var(--bg1); border: 1px solid var(--border-m); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.6); }
      #paletteInput { width: 100%; padding: 13px 16px; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--border-m); outline: none; }
      #paletteList { padding: 6px; }
    </style>
  </head>
  <body class="dark">
    <div id="app">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <a href="/" class="brand-mark">
            <svg viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 10 13 3"/><polyline points="7 3 2 10 7 17"/></svg>
          </a>
          <div class="topbar-title"><div class="t1">Code Sync</div><div class="t2">Room IDE</div></div>
        </div>
        <div class="topbar-center">
          <div class="kbd-hint"><span class="kbd">Ctrl</span><span class="kbd">K</span><span style="color:var(--ink-3);margin-left:2px;">palette</span></div>
          <div class="kbd-hint" style="margin-left:10px;"><span class="kbd">Ctrl</span><span class="kbd">↵</span><span style="color:var(--ink-3);margin-left:2px;">run</span></div>
        </div>
        <div class="topbar-right">
          <select id="languageSelect" class="lang-select">
            <option value="python">Python (Judge0)</option>
            <option value="cpp">C++ (Judge0)</option>
            <option value="java">Java (Judge0)</option>
            <option value="minilang">MiniLang (local)</option>
          </select>
          <button id="runBtn" class="btn-run"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Run</button>
          <button id="shareBtn" class="btn-ghost">Share</button>
          <button id="themeBtn" class="btn-ghost" title="Toggle theme">Theme</button>
        </div>
      </div>
      <div class="body-row">
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="section-label">Session</div>
            <div class="room-card">
              <div class="room-id-row">
                <span class="room-id-label">Room</span><span class="room-id-value" id="roomLabel">—</span>
                <a href="/" style="font-size:11px;color:var(--ink-2);text-decoration:none;padding:3px 7px;background:var(--surface);border:1px solid var(--border-m);border-radius:6px;">Home</a>
              </div>
              <div class="identity-grid">
                <input id="nameInput" class="field-input" type="text" placeholder="Your name" autocomplete="off" spellcheck="false" />
                <select id="roleSelect" class="field-select">
                  <option value="editor">✏️ Editor</option>
                  <option value="viewer">👁 Viewer</option>
                </select>
              </div>
              <button id="joinBtn" class="btn-join">Join Room</button>
            </div>
          </div>
          <div class="sidebar-section" style="flex-shrink:0;">
            <div class="online-row"><div class="section-label" style="margin-bottom:0;">Online</div><div class="online-badge"><div class="live-dot"></div><span id="onlineCount">0</span></div></div>
            <div id="usersList" class="users-scroll"></div>
          </div>
          <div class="chat-section">
            <div class="chat-header"><div class="section-label" style="margin-bottom:0;">Chat</div><span id="chatStatus" style="font-family:var(--font-mono);font-size:10px;color:var(--ink-3);">—</span></div>
            <div id="chatLog"></div>
            <div class="chat-input-row">
              <input id="chatInput" type="text" placeholder="Message…" autocomplete="off" spellcheck="false" />
              <button id="chatSendBtn" class="btn-send">↑</button>
            </div>
          </div>
        </aside>
        <main class="main-area">
          <div class="tabs-bar"><div id="tabs"></div><span id="syncStatus">Not connected</span></div>
          <div class="editor-wrap"><div id="editor" class="monaco-container"></div></div>
          <div id="resizeHandle" class="resize-handle"></div>
          <div id="bottomPanel">
            <div class="bottom-pane"><div class="pane-label">stdin</div><textarea id="stdin" placeholder="Optional input…" spellcheck="false"></textarea></div>
            <div class="bottom-pane"><div class="pane-label"><span>Output</span><button id="clearOutputBtn" class="btn-clear">Clear</button></div><pre id="output"></pre></div>
          </div>
        </main>
      </div>
    </div>
    <div id="toasts"></div>
    <div id="paletteBackdrop" class="hidden"></div>
    <div id="palette" class="hidden"><div class="palette-inner fade-in"><input id="paletteInput" placeholder="Type a command…" autocomplete="off" /><div id="paletteList"></div></div></div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
