<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Sync – Compiler (Solo)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg0: #07090f; --bg1: #0d1117; --bg2: #161b22;
        --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.10);
        --ink: #e6edf3; --ink2: #7d8590; --blue: #4d9de0;
        --mono: 'JetBrains Mono', monospace;
      }
      html, body { height: 100%; font-family: Inter, ui-sans-serif, system-ui; background: var(--bg0); color: var(--ink); }
      .glass { background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(14px); }
      .mono { font-family: var(--mono); }
      .monaco-container { position: relative; width: 100%; height: 100%; }
      .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--bg1); }
      .shell { height: calc(100% - 52px); display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
      .side { border-left: 1px solid var(--border); background: var(--bg1); display: flex; flex-direction: column; min-height: 0; }
      .pane { padding: 12px; min-height: 0; display: flex; flex-direction: column; }
      .pane + .pane { border-top: 1px solid var(--border); flex: 1; }
      .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin-bottom: 8px; }
      #stdin, #output { width: 100%; border-radius: 10px; border: 1px solid var(--border); background: var(--bg2); color: var(--ink); padding: 10px; font-family: var(--mono); font-size: 12px; }
      #stdin { height: 130px; resize: vertical; }
      #output { flex: 1; overflow: auto; white-space: pre-wrap; }
      @media (max-width: 1024px) { .shell { grid-template-columns: 1fr; } .side { border-left: 0; border-top: 1px solid var(--border);} }
    </style>
  </head>

  <body class="h-full dark">
    <div class="topbar">
        <div class="flex items-center gap-2">
          <a href="/" class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400"></a>
          <div>
            <div class="text-sm font-semibold">Compiler (Solo)</div>
            <div class="text-xs text-slate-400 mono">Run Judge0 or MiniLang without a room</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <select id="languageSelect" class="glass rounded-xl px-3 py-2 text-sm border border-white/10 bg-transparent mono">
            <option value="python">Python (Judge0)</option>
            <option value="cpp">C++ (Judge0)</option>
            <option value="java">Java (Judge0)</option>
            <option value="minilang">MiniLang (local)</option>
          </select>
          <button
            id="runBtn"
            class="rounded-xl px-4 py-2 text-sm font-semibold bg-emerald-500/90 hover:bg-emerald-500 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            Run
          </button>
          <button id="themeBtn" class="rounded-xl px-3 py-2 text-sm glass hover:bg-white/10 border border-white/10 mono">
            Theme
          </button>
        </div>
    </div>

      <div class="shell">
        <div class="border-r border-white/10 min-h-0">
          <div id="editor" class="monaco-container min-h-0"></div>
        </div>
        <div class="side">
          <div class="pane">
            <div class="label">stdin</div>
            <textarea id="stdin" placeholder="Optional input..."></textarea>
          </div>
          <div class="pane">
            <div class="flex items-center justify-between mb-2">
              <div class="label" style="margin-bottom:0;">output</div>
              <button id="clearOutputBtn" class="rounded-xl px-3 py-2 text-xs glass hover:bg-white/10 border border-white/10 mono">
                Clear
              </button>
            </div>
            <pre id="output"></pre>
          </div>
        </div>
      </div>

    <div id="toasts" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/compiler.js"></script>
  </body>
</html>
