<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Sync – Compiler (Solo)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        height: 100%;
        font-family: Inter, ui-sans-serif, system-ui;
      }
      .glass {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(14px);
      }
      .monaco-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body class="h-full bg-slate-950 text-slate-100 dark">
    <div class="h-full flex flex-col">
      <div class="px-3 py-2 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-2">
          <a href="/" class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400"></a>
          <div>
            <div class="text-sm font-semibold">Compiler (Solo)</div>
            <div class="text-xs text-slate-300">Run Judge0 or MiniLang without a room</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <select id="languageSelect" class="glass rounded-xl px-3 py-2 text-sm border border-white/10 bg-transparent">
            <option value="python">Python (Judge0)</option>
            <option value="cpp">C++ (Judge0)</option>
            <option value="java">Java (Judge0)</option>
            <option value="minilang">MiniLang (local)</option>
          </select>
          <button
            id="runBtn"
            class="rounded-xl px-4 py-2 text-sm font-semibold bg-emerald-500/90 hover:bg-emerald-500"
          >
            Run
          </button>
          <button id="themeBtn" class="rounded-xl px-3 py-2 text-sm glass hover:bg-white/10 border border-white/10">
            Theme
          </button>
        </div>
      </div>

      <div class="flex-1 grid grid-cols-12">
        <div class="col-span-12 lg:col-span-8 border-r border-white/10">
          <div id="editor" class="monaco-container"></div>
        </div>
        <div class="col-span-12 lg:col-span-4 flex flex-col">
          <div class="p-3 border-b border-white/10">
            <div class="text-sm font-semibold mb-2">stdin</div>
            <textarea
              id="stdin"
              class="w-full h-28 rounded-2xl p-3 text-sm bg-transparent border border-white/10 outline-none"
            ></textarea>
          </div>
          <div class="p-3 flex-1">
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm font-semibold">Output</div>
              <button id="clearOutputBtn" class="rounded-xl px-3 py-2 text-xs glass hover:bg-white/10 border border-white/10">
                Clear
              </button>
            </div>
            <pre id="output" class="w-full h-[calc(100%-28px)] rounded-2xl p-3 text-xs overflow-auto bg-black/30 border border-white/10"></pre>
          </div>
        </div>
      </div>
    </div>

    <div id="toasts" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/compiler.js"></script>
  </body>
</html>
